<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gratidão</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000"><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:120px}#splash{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:sumir.5s forwards 3s}#splash.g{width:180px;height:180px;background:linear-gradient(135deg,#ffcc00,#ff9900);border-radius:35px;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:900;color:#000;box-shadow:0 0 40px #ffcc00;animation:cresce 2.5s ease}#splash.txt{font-size:32px;font-weight:900;color:#ffcc00;letter-spacing:8px;margin-top:20px;animation:aparece 1s ease.8s both}.header{background:#111;border-bottom:3px solid #ffcc00;padding:10px;position:sticky;top:0;z-index:30;text-align:center}.search{width:95%;margin:8px auto;display:flex;gap:5px}.search input{flex:1;padding:12px;background:#222;border:1px solid #444;color:#fff;border-radius:10px}.search button{padding:12px 15px;background:#ffcc00;border:none;border-radius:10px;font-weight:900}.generos{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.pasta{background:#1c1c1c;border:1px solid #333;border-radius:16px;overflow:hidden;position:relative;min-height:170px}.capaImg{width:100%;height:100px;background:#222;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:35px}.info{padding:10px}.btn-pasta{position:absolute;top:6px;right:6px;background:#ff2222;border:none;color:#fff;border-radius:50%;width:26px;height:26px;z-index:5}.btn-capa{position:absolute;top:6px;left:6px;background:#00aaff;border:none;color:#fff;border-radius:50%;width:26px;height:26px;z-index:5}.btn-open{width:100%;margin-top:6px;background:#ffcc00;border:none;padding:8px;border-radius:8px;font-weight:900;font-size:11px}.topo{padding:10px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:6px;border-bottom:2px solid #222}.topo.voltar{background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:900}.filme{background:#1a1a1a;border-left:4px solid #ffcc00;border-radius:12px;margin:8px 10px;padding:10px;display:flex;justify-content:space-between;align-items:center}.barra{position:fixed;bottom:0;left:0;width:100%;background:#111;border-top:2px solid #222;display:flex;gap:4px;padding:8px;z-index:40}.barra button{flex:1;padding:11px 2px;border-radius:10px;border:none;font-weight:900;font-size:7.5px}#modalP,#modalG,#modalS,#modalF,#modalL,#modalB,#modalC{display:none;position:fixed;inset:0;background:rgba(0,0,0,.98);z-index:999;padding:15px;overflow:auto}input,select{width:100%;padding:12px;margin:6px 0;background:#222;color:#fff;border:1px solid #444;border-radius:8px}.big{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:12px;font-weight:900;margin:8px 0}.btns{display:flex;gap:6px;flex-wrap:wrap}.btns button{flex:1;min-width:80px;padding:10px;border:none;border-radius:8px;font-weight:900;font-size:11px}@keyframes cresce{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1);opacity:1}}@keyframes aparece{0%{opacity:0;letter-spacing:30px}100%{opacity:1;letter-spacing:8px}}@keyframes sumir{to{opacity:0;visibility:hidden}}</style></head><body>
<div id="splash"><div class="g">G</div><div class="txt">GRATIDÃO</div></div>
<div class="header"><b style="color:#ffcc00">G GRATIDÃO</b><div class="search"><input id="busca" placeholder="🔍 Pesquisar..." oninput="filtrar()"><button onclick="filtrar()">🔍</button></div></div>
<div id="telaGeneros"></div><div id="telaSub" style="display:none"></div><div id="telaFilmes" style="display:none"></div>
<div class="barra"><button style="background:#00ff88" onclick="abrirAddFilme()">📱 MEMÓRIA</button><button style="background:#00aaff;color:#fff" onclick="abrirAddLink()">🔗 LINK</button><button style="background:#ffcc00" onclick="abrirGenero()">➕ GÊNERO</button><button style="background:#ff8800;color:#fff" onclick="abrirBackup()">💾 BACKUP</button><button style="background:#fff" onclick="resetar()">🔄 RESET</button></div>
<input type="file" id="fileInput" accept="video/*" style="display:none"><input type="file" id="fileCapaInput" accept="image/*" style="display:none"><input type="file" id="fileBackup" accept=".json" style="display:none">
<div id="modalP"><button onclick="fecharP()" style="position:absolute;top:10px;right:10px;background:#ffcc00;border:none;padding:10px 15px;border-radius:10px;font-weight:bold;z-index:1000">✕ FECHAR</button><button onclick="fecharP()" style="position:absolute;top:10px;left:10px;background:#333;color:#fff;border:none;padding:10px 15px;border-radius:10px;font-weight:bold;z-index:1000">⬅️ VOLTAR</button><video id="v" controls autoplay style="width:100%;height:85%;margin-top:50px"></video><iframe id="yt" style="width:100%;height:85%;margin-top:50px;display:none" allowfullscreen frameborder="0"></iframe></div>
<div id="modalG"><button onclick="fecharModais()" style="background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px">⬅️ VOLTAR</button><h2 style="color:#ffcc00">➕ Nova Pasta</h2><input id="nomeGenero" placeholder="Ex: Desenhos"><button class="big" onclick="salvarGenero()">CRIAR</button></div>
<div id="modalS"><button onclick="fecharModais()" style="background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px">⬅️ VOLTAR</button><h2 style="color:#00ff88">📁 Nova Subpasta</h2><input id="nomeSub" placeholder="Ex: Dragon ball"><div id="previewCapa" style="width:100%;height:120px;background:#222;border-radius:10px;margin:8px 0;display:none;background-size:cover;background-position:center"></div><button class="big" style="background:#222;border:1px dashed #00aaff;color:#00aaff" onclick="document.getElementById('fileCapaInput').click()">🖼️ ESCOLHER CAPA</button><button class="big" style="background:#00ff88" onclick="salvarSub()">CRIAR</button></div>
<div id="modalC"><button onclick="fecharModais()" style="background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px">⬅️ VOLTAR</button><h2 style="color:#00aaff">🖼️ Mudar Capa</h2><div id="previewCapa2" style="width:100%;height:150px;background:#222;border-radius:10px;margin:8px 0;display:none;background-size:cover;background-position:center"></div><button class="big" style="background:#222;border:1px dashed #00aaff;color:#00aaff" onclick="document.getElementById('fileCapaInput').click()">🖼️ ESCOLHER FOTO</button><button class="big" style="background:#00aaff;color:#fff" onclick="salvarCapaNova()">✅ SALVAR CAPA</button></div>
<div id="modalF"><button onclick="fecharModais()" style="background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px">⬅️ VOLTAR</button><h2 style="color:#00ff88">📱 Adicionar Filme</h2><select id="fGenero"></select><select id="fSub"></select><input id="fNomeBonito" placeholder="Nome bonito"><div id="nomeArquivo" style="background:#111;padding:10px;border-radius:8px;color:#00ff88;margin:6px 0;display:none"></div><button class="big" style="background:#222;border:1px dashed #555" onclick="document.getElementById('fileInput').click()">📂 ESCOLHER MP4</button><button id="btnSalvar" onclick="salvarDaMemoria()" style="display:none" class="big">✅ SALVAR</button></div>
<div id="modalL"><button onclick="fecharModais()" style="background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px">⬅️ VOLTAR</button><h2 style="color:#00aaff">🔗 Adicionar Link</h2><select id="lGenero"></select><select id="lSub"></select><input id="lNome" placeholder="Nome do filme"><input id="lLink" placeholder="Link mp4 ou YouTube"><button class="big" style="background:#00aaff;color:#fff" onclick="salvarLink()">✅ SALVAR LINK</button></div>
<div id="modalB"><button onclick="fecharModais()" style="background:#333;color:#fff;border:none;padding:10px 14px;border-radius:8px">⬅️ VOLTAR</button><h2 style="color:#ff8800">💾 Backup</h2><button class="big" style="background:#ffcc00" onclick="fazerBackup()">⬇️ BAIXAR</button><button class="big" style="background:#00aaff;color:#fff" onclick="document.getElementById('fileBackup').click()">⬆️ RESTAURAR</button></div>
<script>
let tempCapa=null;function iconeNome(n){let l=(n||'').toLowerCase();if(l.includes('dragon'))return'🐉';if(l.includes('fic'))return'👽';if(l.includes('acao')||l.includes('ação'))return'🔥';if(l.includes('desenho'))return'🎨';return'🎬';}
function limpaNome(n){try{return n.replace(/\.mp4|\.mkv|\.avi|\.mov/gi,'').replace(/_/g,' ').trim();}catch(e){return n;}}
let base=[{nome:"🔥 Ação",subpastas:[{nome:"Geral",filmes:[],capa:""}]},{nome:"👽 Ficção",subpastas:[{nome:"Geral",filmes:[],capa:""}]},{nome:"🐉 Dragon ball",subpastas:[{nome:"Geral",filmes:[],capa:""}]},{nome:"🎨 Desenhos",subpastas:[{nome:"Geral",filmes:[],capa:""}]}];
let dados;try{let s=localStorage.getItem('plugtv_v5_sub');if(s){let tmp=JSON.parse(s);dados=tmp.map(g=>{if(!g.subpastas) return {nome:g.nome,subpastas:[{nome:"Geral",filmes:g.filmes||[],capa:""}]};g.subpastas=g.subpastas.map(x=>({nome:x.nome,filmes:x.filmes||[],capa:x.capa||""}));return g;});}else dados=base;}catch(e){dados=base;}
function salvarLS(){localStorage.setItem('plugtv_v5_sub',JSON.stringify(dados));}
let pastaAtual=0,subAtual=0,arquivoTemp=null,db=null,capaEditando=null;
let r=indexedDB.open('PlugTVv5',2);r.onupgradeneeded=e=>{try{e.target.result.createObjectStore('videos',{keyPath:'id'});}catch(e){}};r.onsuccess=e=>{db=e.target.result;renderGeneros();};r.onerror=()=>renderGeneros();
function renderGeneros(filtro){let lista=dados;if(filtro&&filtro.trim()!=""){let f=filtro.toLowerCase();lista=dados.filter(g=>g.nome.toLowerCase().includes(f)||g.subpastas.some(s=>s.nome.toLowerCase().includes(f)));}let h='<div class="generos">';lista.forEach(gReal=>{let i=dados.indexOf(gReal);let tot=0;try{tot=gReal.subpastas.reduce((a,s)=>a+(s.filmes?s.filmes.length:0),0);}catch(e){}h+='<div class="pasta" onclick="abrirPasta('+i+')"><button class="btn-pasta" onclick="event.stopPropagation();delGenero('+i+')">🗑️</button><div class="capaImg" style="background:#222">'+iconeNome(gReal.nome)+'</div><div class="info"><b>'+gReal.nome+'</b><br><small>'+gReal.subpastas.length+' subs • '+tot+' filmes</small><button class="btn-open">ABRIR</button></div></div>';});h+='</div>';document.getElementById('telaGeneros').innerHTML=h;document.getElementById('telaGeneros').style.display='block';document.getElementById('telaSub').style.display='none';document.getElementById('telaFilmes').style.display='none';}
function filtrar(){renderGeneros(document.getElementById('busca').value);}
function abrirPasta(i){pastaAtual=i;let g=dados[i];let h='<div class="topo"><button class="voltar" onclick="renderGeneros()">⬅️ VOLTAR</button><b>'+g.nome+'</b><div class="btns"><button onclick="abrirSub()" style="background:#00ff88">📁 + SUB</button><button onclick="abrirAddFilme('+i+')" style="background:#ffcc00">📱 +</button></div></div><div class="generos">';g.subpastas.forEach((s,si)=>{let estilo=s.capa?'background-image:url(\''+s.capa+'\')':'background:#111';let texto=s.capa?'':'📁 '+s.nome;h+='<div class="pasta"><button class="btn-pasta" onclick="delSub('+i+','+si+')">🗑️</button><button class="btn-capa" onclick="abrirCapa('+i+','+si+')">🖼️</button><div class="capaImg" style="'+estilo+'">'+texto+'</div><div class="info"><b>'+s.nome+'</b><br><small>'+s.filmes.length+' filmes</small><button class="btn-open" style="background:#00ff88" onclick="abrirSubPasta('+i+','+si+')">ABRIR</button></div></div>';});h+='</div>';document.getElementById('telaSub').innerHTML=h;document.getElementById('telaSub').style.display='block';document.getElementById('telaGeneros').style.display='none';}
function abrirSubPasta(pi,si){pastaAtual=pi;subAtual=si;let s=dados[pi].subpastas[si];let h='<div class="topo"><button class="voltar" onclick="abrirPasta('+pi+')">⬅️ VOLTAR</button><b>📁 '+s.nome+'</b><div class="btns"><button onclick="abrirAddFilme('+pi+','+si+')" style="background:#00ff88">📱 +</button><button onclick="abrirAddLink('+pi+','+si+')" style="background:#00aaff;color:#fff">🔗 +</button><button onclick="abrirCapa('+pi+','+si+')" style="background:#ff8800;color:#fff">🖼️ CAPA</button></div></div>';if(!s.filmes||s.filmes.length==0){h+='<div style="text-align:center;padding:30px"><p>Vazio</p><button onclick="abrirAddFilme('+pi+','+si+')" style="background:#00ff88;border:none;padding:12px 20px;border-radius:10px;font-weight:900">📱 ADICIONAR</button><div style="margin-top:20px"><button onclick="abrirPasta('+pi+')" style="background:#333;color:#fff;border:none;padding:10px 20px;border-radius:8px">⬅️ VOLTAR</button></div></div>';}else{s.filmes.forEach((f,fi)=>{h+='<div class="filme"><b>🎬 '+f.nome+'</b><span><button style="background:#ffcc00;border:none;padding:8px 12px;border-radius:8px" onclick="play('+pi+','+si+','+fi+')">▶️</button><button style="background:#333;color:#fff;border:none;padding:8px 10px;border-radius:8px;margin-left:4px" onclick="delFilme('+pi+','+si+','+fi+')">🗑️</button></span></div>';});h+='<div style="text-align:center;padding:15px"><button onclick="abrirPasta('+pi+')" style="background:#333;color:#fff;border:none;padding:10px 20px;border-radius:8px">⬅️ VOLTAR PARA PASTAS</button></div>';}document.getElementById('telaFilmes').innerHTML=h;document.getElementById('telaFilmes').style.display='block';document.getElementById('telaSub').style.display='none';}
function abrirGenero(){document.getElementById('modalG').style.display='block';}
function salvarGenero(){let n=document.getElementById('nomeGenero').value.trim();if(!n)return alert('Nome');dados.push({nome:n,subpastas:[{nome:"Geral",filmes:[],capa:""}]});document.getElementById('nomeGenero').value='';salvarLS();renderGeneros();fecharModais();}
function abrirSub(){tempCapa=null;document.getElementById('previewCapa').style.display='none';document.getElementById('modalS').style.display='block';}
function salvarSub(){let n=document.getElementById('nomeSub').value.trim();if(!n)return alert('Nome');dados[pastaAtual].subpastas.push({nome:n,filmes:[],capa:tempCapa||""});document.getElementById('nomeSub').value='';tempCapa=null;document.getElementById('previewCapa').style.display='none';salvarLS();abrirPasta(pastaAtual);fecharModais();}
function abrirCapa(pi,si){capaEditando={pi,si};tempCapa=dados[pi].subpastas[si].capa||null;let prev=document.getElementById('previewCapa2');if(tempCapa){prev.style.backgroundImage='url(\''+tempCapa+'\')';prev.style.display='block';}else{prev.style.display='none';}document.getElementById('modalC').style.display='block';}
function salvarCapaNova(){if(!tempCapa)return alert('Escolhe foto');dados[capaEditando.pi].subpastas[capaEditando.si].capa=tempCapa;tempCapa=null;salvarLS();fecharModais();abrirPasta(capaEditando.pi);}
function popularSelects(preG,preS){let selG=document.getElementById('fGenero');let selS=document.getElementById('fSub');let selLG=document.getElementById('lGenero');let selLS=document.getElementById('lSub');selG.innerHTML='';selLG.innerHTML='';dados.forEach((g,i)=>{selG.innerHTML+='<option value="'+i+'" '+(i==preG?'selected':'')+'>'+g.nome+'</option>';selLG.innerHTML+='<option value="'+i+'" '+(i==preG?'selected':'')+'>'+g.nome+'</option>';});function fillSub(sel,gi){sel.innerHTML='';if(dados[gi]&&dados[gi].subpastas){dados[gi].subpastas.forEach((s,si)=>{sel.innerHTML+='<option value="'+si+'" '+(si==preS?'selected':'')+'>'+s.nome+'</option>';});}}if(preG!==undefined){fillSub(selS,preG);fillSub(selLS,preG);}selG.onchange=()=>fillSub(selS,selG.value);selLG.onchange=()=>fillSub(selLS,selLG.value);}
function abrirAddFilme(preG,preS){popularSelects(preG,preS);document.getElementById('modalF').style.display='block';}
function abrirAddLink(preG,preS){popularSelects(preG,preS);document.getElementById('modalL').style.display='block';}
function abrirBackup(){document.getElementById('modalB').style.display='block';}
document.getElementById('fileInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;arquivoTemp=f;document.getElementById('nomeArquivo').style.display='block';document.getElementById('nomeArquivo').innerText='📄 '+f.name;document.getElementById('fNomeBonito').value=limpaNome(f.name);document.getElementById('btnSalvar').style.display='block';});
document.getElementById('fileCapaInput').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=ev=>{tempCapa=ev.target.result;document.getElementById('previewCapa').style.backgroundImage='url(\''+tempCapa+'\')';document.getElementById('previewCapa').style.display='block';document.getElementById('previewCapa2').style.backgroundImage='url(\''+tempCapa+'\')';document.getElementById('previewCapa2').style.display='block';};reader.readAsDataURL(f);});
function salvarDaMemoria(){let nome=document.getElementById('fNomeBonito').value.trim();if(!nome)return alert('Nome');if(!arquivoTemp)return alert('Arquivo');let gi=document.getElementById('fGenero').value;let si=document.getElementById('fSub').value||0;let id='vid_'+Date.now();let tx=db.transaction('videos','readwrite');tx.objectStore('videos').put({id:id,blob:arquivoTemp});tx.oncomplete=()=>{dados[gi].subpastas[si].filmes.push({nome:nome,tipo:'local',link:id});salvarLS();fecharModais();document.getElementById('nomeArquivo').style.display='none';document.getElementById('btnSalvar').style.display='none';arquivoTemp=null;abrirSubPasta(gi,si);};}
function salvarLink(){let gi=document.getElementById('lGenero').value;let si=document.getElementById('lSub').value||0;let nome=document.getElementById('lNome').value.trim();let link=document.getElementById('lLink').value.trim();if(!nome||!link)return alert('Nome e link');let tipo=(link.includes('youtube')||link.includes('youtu.be'))?'youtube':'link';if(tipo=='youtube'){if(link.includes('watch?v='))link=link.replace('watch?v=','embed/'); if(link.includes('youtu.be/')){let id=link.split('youtu.be/')[1].split('?')[0]; link='https://www.youtube-nocookie.com/embed/'+id;}}dados[gi].subpastas[si].filmes.push({nome:nome,tipo:tipo,link:link});salvarLS();fecharModais();document.getElementById('lNome').value='';document.getElementById('lLink').value='';abrirSubPasta(gi,si);}
function play(pi,si,fi){let f=dados[pi].subpastas[si].filmes[fi];document.getElementById('modalP').style.display='block';document.getElementById('yt').style.display='none';document.getElementById('v').style.display='block';if(f.tipo=='local'){let tx=db.transaction('videos','readonly');let r=tx.objectStore('videos').get(f.link);r.onsuccess=()=>{let url=URL.createObjectURL(r.result.blob);let v=document.getElementById('v');v.src=url;v.play();};}else if(f.tipo=='youtube'){document.getElementById('v').style.display='none';document.getElementById('yt').style.display='block';document.getElementById('yt').src=f.link;}else{let v=document.getElementById('v');v.src=f.link;v.play();}}
function fecharP(){document.getElementById('modalP').style.display='none';try{document.getElementById('v').pause();}catch(e){}document.getElementById('yt').src='';}
function fecharModais(){document.getElementById('modalG').style.display='none';document.getElementById('modalS').style.display='none';document.getElementById('modalF').style.display='none';document.getElementById('modalL').style.display='none';document.getElementById('modalB').style.display='none';document.getElementById('modalC').style.display='none';}
function delGenero(i){if(confirm('Apagar '+dados[i].nome+'?')){dados.splice(i,1);salvarLS();renderGeneros();}}
function delSub(pi,si){if(si==0)return alert('Não pode apagar Geral');if(confirm('Apagar subpasta?')){dados[pi].subpastas.splice(si,1);salvarLS();abrirPasta(pi);}}
function delFilme(pi,si,fi){if(confirm('Apagar?')){let f=dados[pi].subpastas[si].filmes[fi];if(f.tipo=='local'&&db){try{db.transaction('videos','readwrite').objectStore('videos').delete(f.link);}catch(e){}}dados[pi].subpastas[si].filmes.splice(fi,1);salvarLS();abrirSubPasta(pi,si);}}
function resetar(){if(confirm('Apagar tudo?')){localStorage.clear();location.reload();}}
function fazerBackup(){try{let txt=JSON.stringify(dados);let a=document.createElement('a');a.href='data:text/json;charset=utf-8,'+encodeURIComponent(txt);a.download='backup-gratidao.json';a.click();}catch(e){alert('Erro');}}
document.getElementById('fileBackup').addEventListener('change',e=>{let file=e.target.files[0];let r=new FileReader();r.onload=ev=>{try{dados=JSON.parse(ev.target.result);salvarLS();renderGeneros();fecharModais();alert('Restaurado!');}catch(err){alert('Erro');}};r.readAsText(file);});
setTimeout(()=>{if(document.getElementById('telaGeneros').innerHTML==""){renderGeneros();}},400);
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js');}
</script></body></html>
